<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCAT Practice</title>
<style>body{font:16px system-ui;margin:0;background:#f5f5f5;color:#222}main{max-width:800px;margin:auto;padding:24px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.card{background:white;padding:22px;border-radius:12px;margin-top:18px}.timer{font-size:1.5rem;font-weight:700}.choice{display:block;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}button{padding:10px 16px;font-size:16px}.hidden{display:none}.muted{color:#666}.correct{color:#087a35}.wrong{color:#a21b1b}</style></head>
<body><main><h1>CCAT-style Practice</h1><p class="muted">Loads questions from <code>questions.json</code>. Default simulation: 50 questions / 15 minutes.</p>
<div class="bar"><button id="start">Start test</button><button id="finish" class="hidden">Finish now</button><span id="timer" class="timer">15:00</span><span id="progress"></span></div>
<div id="q" class="card hidden"></div><div id="results" class="card hidden"></div></main>
<script>
let questions=[],idx=0,answers={},seconds=900,timer=null,started=false;
const $=s=>document.querySelector(s);
async function load(){try{const r=await fetch('questions.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);questions=await r.json();$('#start').disabled=false;}catch(e){$('#start').disabled=true;$('#results').classList.remove('hidden');$('#results').innerHTML='<b>Could not load questions.json.</b><p>Browsers often block fetch when this HTML is opened directly as a file. Run a tiny local server in this directory, e.g. <code>python -m http.server 8000</code>, then open <code>http://localhost:8000/ccat-practice.html</code>.</p>';}}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function render(){if(idx>=questions.length)return finish();const x=questions[idx];$('#progress').textContent=`Question ${idx+1} of ${questions.length}`;$('#q').classList.remove('hidden');$('#q').innerHTML=`<h2>${idx+1}. ${x.question}</h2>`+x.choices.map((c,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${answers[idx]===i?'checked':''}> ${String.fromCharCode(65+i)}) ${c}</label>`).join('')+`<div class="bar"><button id="skip">Skip</button><button id="next">Next</button></div>`;document.querySelectorAll('input[name=answer]').forEach(r=>r.onchange=()=>answers[idx]=+r.value);$('#skip').onclick=()=>{idx++;render()};$('#next').onclick=()=>{idx++;render()};}
function start(){if(started)return;started=true;idx=0;answers={};seconds=900;$('#start').classList.add('hidden');$('#finish').classList.remove('hidden');$('#results').classList.add('hidden');$('#timer').textContent=fmt(seconds);render();timer=setInterval(()=>{seconds--;$('#timer').textContent=fmt(seconds);if(seconds<=0)finish()},1000)}
function finish(){if(!started)return;started=false;clearInterval(timer);$('#q').classList.add('hidden');$('#finish').classList.add('hidden');$('#start').classList.remove('hidden');let correct=0;questions.forEach((q,i)=>{if(answers[i]===q.answer)correct++});let attempted=Object.keys(answers).length;$('#progress').textContent='';$('#results').classList.remove('hidden');$('#results').innerHTML=`<h2>Results</h2><p><b>${correct}</b> correct out of ${questions.length}</p><p>${attempted} attempted · ${questions.length-attempted} unanswered · ${900-seconds} seconds used</p><p class="muted">This is practice scoring, not an official CCAT percentile or scaled score.</p>`}
$('#start').onclick=start;$('#finish').onclick=finish;load();
</script></body></html>
